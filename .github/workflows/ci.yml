name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CallCalendar.sln

      - name: Lint
        run: dotnet format CallCalendar.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CallCalendar.sln -c Release --no-restore

      - name: Test
        run: dotnet test CallCalendar.sln -c Release --no-build

  e2e:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CallCalendar.sln

      - name: Build E2E project
        run: dotnet build tests/CallCalendar.E2E.Tests -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh tests/CallCalendar.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test E2E
        run: RUN_E2E=1 dotnet test tests/CallCalendar.E2E.Tests -c Release --no-build --no-restore
